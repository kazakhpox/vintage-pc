plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version "${moddev_version}"
}

version = project.mod_version
group = project.maven_group
base.archivesName = project.mod_id

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    maven { url = 'https://mcef-download.cinemamod.com/repositories/releases' }
}

neoForge {
    version = project.neo_version
    runs {
        client { client() }
        client2 { client(); programArguments.addAll('--username', 'Player2') } // второй клиент для теста LAN
        server { server(); programArgument('--nogui') }
    }
    mods {
        "${mod_id}" { sourceSet(sourceSets.main) }
    }
}

dependencies {
    // MCEF нужен только клиенту; выделенный сервер работает без него.
    compileOnly "${mcef_group}:${mcef_artifact}:${mcef_version}"
    runtimeOnly "${mcef_group}:${mcef_artifact}:${mcef_version}"
}

processResources {
    def props = [mod_id: mod_id, mod_version: mod_version, neo_version: neo_version, minecraft_version: minecraft_version]
    inputs.properties props
    filesMatching('META-INF/neoforge.mods.toml') { expand props }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
